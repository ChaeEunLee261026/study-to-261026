<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

 <style> 
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
/* 스타일 기본 요소 */

        .item {
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

        .container{
            display: flex;
            /* flex-direction: column-reverse; */
            flex-direction: row;
             flex-wrap: wrap;  /* flex-flow: row wrap;으로도 작성 */
           
             /* 주축설정 */
             justify-content: space-between;

             /* 교차축 정렬 */
             align-items: center;  /* 각 content들을 가운데 정렬 */
             /* flex-start 효과 test */
             align-content: center; /* 모든 content들의 덩어리를 가운데 정렬 */
             height: 400px;
             background-color: lightblue;
        }

        .content-center{
            /* text-align: center; 
        padding-top: 36px;*/
    display: flex;
    justify-content: center;
    align-items: center;
    }

</style> 

<body>

    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item content-center">3</div>
        <div class="item">4</div>
        <div class="item content-center">5</div>
        <div class="item content-center">6</div>
    </div>

</body>
</html>
