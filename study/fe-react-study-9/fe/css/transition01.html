<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    /* * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        } 스타일 기본 셋팅 값*/

    .box {
        width: 100px;
        height: 100px;
        background-color: purple;
        margin: 20px;

        transition-property: all;
        transition-duration: 0.5s;
        /* transition-delay:2s; */

        /* tranisition 효과(전환효과) : 기존에 보유한 속성값 → 변경될 속성값 */
        /* transition : 속성위치
         기존 : 마우스 올릴때, 내릴때 작동
         hover : 마우스 올릴때 작동, 내릴때 작동X */
    }

    .box:hover {
        width: 300px;
        background-color: aquamarine;
    }

        .container:hover .box{
            width: 300px;
            background-color: aquamarine;

        }
    
</style>

<body>

    <div class="box"></div>

    <div class="container">
        <div class="box" style="transition-timing-function: linear;"></div>
        <div class="box" style="transition-timing-function: ease;"></div>
        <div class="box" style="transition-timing-function: cubic-bezier(0.79, 0.26, 1, 0.24);"></div>
        <div class="box" style="transition-timing-function: ease-in;"></div>
        <div class="box" style="transition-timing-function: ease-out;"></div>
        <div class="box" style="transition-timing-function: ease-in-out;"></div>
    </div>

</body>

</html>
