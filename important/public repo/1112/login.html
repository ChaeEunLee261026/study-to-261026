<!-- login.html -->


<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        /* 전체 화면 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center; /* 가로 가운데 배치 */
            align-items: center;    /* 세로 가운데 배치 */
            background-color: white;
        }

        /* 로그인 박스 */
        .login-container {
            width: 500px;
            max-width: 100%;
            padding: 15px 30px 30px;
            background-color: #354e4c;
            text-align: center;
        }

        /* Welcome Back */
        h1 {
            color: white;
            font-size: 25px;
            font-weight: normal;
            margin-bottom: 30px;
        }

        /* 입력창 */
        input {
            width: 100%;
            height: 40px;
            margin-bottom: 28px;
            padding: 10px;
            background-color: transparent;
            border: 1px solid #a4b3ae;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input::placeholder {
            color: #aebbb7;
        }

        /* 로그인 버튼 */
        button {
            width: 100%;
            height: 60px;
            background-color: #39b99b;
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2da88b;
        }
    </style>
</head>

<body>
<!-- 
            onsubmit : 폼 제출 이벤트 발생 (form 전체의 제출이 발생했을 때)
            onclick : 특정 요소를 클릭했을 때 실행되는 이벤트 (버튼이나 이미지 등을 클릭했을 때)

            return event1() : 함수의 반환값을 제출 이벤트에 전달
            return false : 폼의 기본 제출 동작 취소
            return true : 폼의 기본 제출 동작 허용

            .value : 입력창에 작성된 값 가져오기
            form : 사용자의 입력 정보를 묶는 태그

               placeholder    vs    value
       역할   : 입력 안내 문구         실제 입력값
입력 전 표시   : 연한 글씨             일반 글씨
사용자가 입력시 : 사라짐               입력값이 변경됨
            
             -->



    <div class="login-container">

        <h1>Welcome Back!</h1>

        <form onsubmit="goToMain(); return false;"> 
            

            <input
                type="email"
                id="email"
                placeholder="Email Address *" 
                required
            > 
            <!-- placeholder : HTML에서 입력창에 미리 안내 문구를 표시해 주는 속성 -->

            <input
                type="password"
                id="password"
                placeholder="Password *"
                required
            >

            <button type="submit">LOG IN</button>

        </form>

    </div>

    <script>
        function goToMain() {
            // 게시판 페이지로 이동
            location.href = "main.html";
        }
    </script>

</body>
</html>
