<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* 기본 베이스 설정 */
        /* 전체선택자-모든 요소에 기본 세팅 적용 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 박스모델 사이즈 지정시, border까지 사이즈로 인식 */
        }

  .box {
            width: 200px;
            height: 100px;
            border: 1px solid rgb(42, 197, 146);

            margin: 10px;
            padding: 10px;

            display: inline-block;
        }

        p{font-weight: bold; font-size: 20px;}
        span{font-weight: bold; font-size: 20px;}

    </style>
</head>

<body>
    <P>박스 정렬</P>

    <div class="box"></div>
