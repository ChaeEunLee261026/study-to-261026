<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* 스타일 기본셋팅 */
    * { margin: 0;
        padding: 0;
        box-sizing: border-box;
          
        }

        .box {
            width: 500px;
            margin: 0 auto;
            margin-top: 50px;
            
        }

        .black-box {
            width: 500px;
            margin: 0 auto;
            margin-top: 50px;
          
        }

        .red-box {
            background-color: red;
            width: 250px;
            height: 100px;
            display: inline-block;
        }

        .green-box {
            background-color: green;
            width: 250px;
            height: 100px;
            display: inline-block;
        }

        .blue-box {
            background-color: blue;
            width: 500px;
            height: 200px;
             display: inline-block;
             margin-top: 0px;
        }

        .text{
            text-align: center;
            margin: 0px;
        }
    </style>
</head>


<body>

    <div class="box black-box">
    <div class="box red-box"></div><div class="box green-box"></div>
    <div class="text">글자가운데정렬</div>
    <div class="box blue-box"></div>
    </div>



</body>

</html>
