<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 스타일 기본 요소 */
        .box1 {
             border: 2px solid black; /* 추후 주석처리 부분 */
            width: 800px;
             margin: 0 auto; /* 전체를 화면 가운데 정렬 */
        }

         .box2 {
            display: flex;
        }

         .box3 {
            display: flex;
        }

        .box4 {
            display: flex;
        }

        .box4in {
    display: flex;
    flex-direction: column;
}

.box5 {
            display: flex;
        }

        .yellow {
            background-color: yellow;
            width: 400px;
            height: 100px;
            border: 1px solid black;
        }

        .gray {
            background-color: gray;
            width: 400px;
            height: 100px;
            border: 1px solid black;
        }

        .purple {
            background-color: purple;
            width: 800px;
            height: 100px;
            border: 1px solid black;
        }

        .lightblue{
            background-color: lightblue;
            width: 300px;
            height: 200px;
            border: 1px solid black;
        }

         .lightyellow{
            background-color: lightyellow;
            width: 500px;
            height: 100px;
            border: 1px solid black;
        }

          .lightpink{
            background-color: lightpink;
            width: 500px;
            height: 100px;
            border: 1px solid black;
        }

         .borderyellow  {
            background-color: yellow;
            width: 200px;
            height: 100px;
            border: 1px solid black;
        }

              .borderorange  {
            background-color: rgb(248, 167, 17);
            width: 200px;
            height: 100px;
            border: 1px solid black;
        }

           .borderpink  {
            background-color: rgb(218, 45, 180);
            width: 200px;
            height: 100px;
            border: 1px solid black;
        }

           .bordergreen  {
            background-color: rgb(37, 161, 33);
            width: 200px;
            height: 100px;
            border: 1px solid black;
        }
        
    </style>

</head>

<body>
         
    <div class="box1"> <!-- 1번 전체 박스 -->

        <!-- 2번 노란색 + 회색 -->
         <div class="box2">
        <div class="yellow"></div>
        <div class="gray"> </div>
        </div>

         <!-- 3번 보라색 -->
        <div class="box3">
        <div class="purple"></div>
        </div>

         <!-- 4번 3색 -->
        <div class="box4">
        <div class="lightblue"></div>
        <!-- 왼쪽 부분 -->
         <div class="box4in">
         <div class="lightyellow"></div>
          <div class="lightpink"></div>
          <!-- 오른쪽 부분 -->
        </div>
        </div>

        <!-- 5번 4색 -->
         <div class="box5">
        <div class="borderyellow"></div>
        <div class="borderorange"> </div>
        <div class="borderpink"> </div>
        <div class="bordergreen"> </div>
        </div>

 </div> <!--1번 전체 박스 닫기 -->

</body>

</html>
